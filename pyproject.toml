[project]
name = "deception-machine"
version = "0.1.0"
description = "AI Safety Research Lab: Investigating emergent deceptive behavior in LLMs under misaligned incentives"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "AI Safety Researcher"}
]

dependencies = [
    "ollama>=0.3.0",
    "streamlit>=1.38.0",
    "pydantic>=2.9.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "scipy>=1.14.0",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
deception-machine = "deception_machine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deception_machine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
